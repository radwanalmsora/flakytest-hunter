name: Build & Publish VSIX

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile TypeScript
        run: npm run compile
      - name: Lint
        run: npm run lint --if-present
      - name: Package VSIX
        run: npx @vscode/vsce package --out flakytest-hunter.vsix
      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: flakytest-hunter-vsix
          path: flakytest-hunter.vsix
      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: flakytest-hunter.vsix
          generate_release_notes: true
      - name: Publish to Visual Studio Marketplace (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        run: npx @vscode/vsce publish -p ${{ secrets.VSCE_PAT }}
